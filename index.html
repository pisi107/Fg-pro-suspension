    const name=brand+' '+model+' '+year;live.push(name);hist.push({name,owned:true});
  }else{

function mount(){if(role==='pending_admin')return mountPasswordChange();document.body.dataset.fgAdmin='1';root=document.getElementById('fg-admin-v2')||document.createElement('div');root.id='fg-admin-v2';if(!root.isConnected)document.body.append(root);root.innerHTML='<header class="fg-admin-bar"><img src="images.png" alt="FG Pro Suspension"><nav class="fg-admin-nav"><button data-ad-tab="calendar">Calendario</button><button data-ad-tab="bookings">Prenotazioni</button><button data-ad-tab="users">Utenti</button><button data-ad-tab="catalog">Piste e listino</button><button id="fg-admin-out">Esci</button></nav></header><main class="fg-admin-main"><div id="fg-admin-content"></div></main>';root.querySelectorAll('[data-ad-tab]').forEach(b=>{if(role==='fede'&&b.dataset.adTab!=='calendar')b.remove();else b.onclick=()=>{tab=b.dataset.adTab;selectedDay='';notice='';render()}});root.querySelector('#fg-admin-out').onclick=()=>signOut(auth);render()}
function mountPasswordChange(){document.body.dataset.fgAdmin='1';root=document.getElementById('fg-admin-v2')||document.createElement('div');root.id='fg-admin-v2';if(!root.isConnected)document.body.append(root);root.innerHTML='<header class="fg-admin-bar"><img src="images.png" alt="FG Pro Suspension"><nav class="fg-admin-nav"><button id="fg-admin-out">Esci</button></nav></header><main class="fg-admin-main"><h1>CAMBIA PASSWORD</h1><section class="fg-admin-panel"><h2>Primo accesso di Fede</h2><p class="fg-admin-sub">'+(passwordChanged?'Password aggiornata. Avvisa Giorgio: dovrà attivare il tuo accesso admin.':'Prima di usare l’area admin, imposta una nuova password. L’accesso sarà attivato da Giorgio dopo il cambio.')+'</p>'+(passwordChanged?'':'<div class="fg-admin-row"><input id="ad-new-password" type="password" autocomplete="new-password" placeholder="Nuova password"><input id="ad-repeat-password" type="password" autocomplete="new-password" placeholder="Ripeti nuova password"></div><p class="fg-admin-sub">Minimo 6 caratteri, una maiuscola, un numero e un carattere speciale.</p><button class="fg-admin-action red" id="ad-change-password">Cambia password</button>')+'<div class="fg-admin-notice" id="fg-admin-notice" role="status"></div></section></main>';root.querySelector('#fg-admin-out').onclick=()=>signOut(auth);const save=root.querySelector('#ad-change-password');if(save)save.onclick=async()=>{const p=root.querySelector('#ad-new-password').value,q=root.querySelector('#ad-repeat-password').value;if(p!==q)return message('Le password non coincidono.');if(!/^(?=.{6,})(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9])/.test(p))return message('Usa almeno 6 caratteri, una maiuscola, un numero e un carattere speciale.');save.disabled=true;try{await updatePassword(auth.currentUser,p);passwordChanged=true;mountPasswordChange()}catch(e){save.disabled=false;message('Cambio password non riuscito: '+(e.code||'errore Firebase'))}}}
function dayBookings(d){return ((role==='owner'||role==='admin')?allBookings():requests).filter(r=>r.date===d&&r.status!=='rejected'&&r.status!=='cancelled')}
function dayModal(){if(!selectedDay)return '';const assigned=dateTracks[selectedDay],chosen=Array.isArray(assigned)?assigned:availability[selectedDay]?tracks.map(t=>t.id):[],options=tracks.map(t=>'<label class="fg-admin-track-choice"><input type="checkbox" data-ad-track value="'+esc(t.id)+'" '+(chosen.includes(t.id)?'checked':'')+'><span>'+esc(t.name)+'</span></label>').join(''),booked=dayBookings(selectedDay),cards=booked.map(r=>{const p=profiles[r.userId]||{},name=[p.name,p.surname].filter(Boolean).join(' ')||r.customerName||r.customerEmail||r.userEmail||'Pilota non indicato',email=r.customerEmail||r.userEmail||r.email||p.email||'',status=r.status==='confirmed'?'Confermata':'In attesa di Fede',extra=(role==='owner'||role==='admin')?[p.ranking&&'Ranking: '+p.ranking,p.bike&&'Moto: '+p.bike,p.city&&'Città: '+p.city,p.phone&&'Telefono: '+p.phone].filter(Boolean).map(esc).join(' · '):'';return '<article class="fg-admin-item"><div><small>'+esc(r.track||'Pista non indicata')+'</small><h3>'+esc(name)+'</h3><small>'+esc(email)+'</small>'+(extra?'<p>'+extra+'</p>':'')+'</div><span class="fg-admin-badge '+esc(r.status||'pending')+'">'+status+'</span></article>'}).join('');return '<div class="fg-admin-modal-backdrop" id="ad-day-modal-backdrop"><section class="fg-admin-modal" id="ad-day-modal" role="dialog" aria-modal="true" aria-labelledby="ad-modal-title" tabindex="-1"><div class="fg-admin-modal-head"><h2 id="ad-modal-title">'+esc(dateLabel(selectedDay))+'</h2><button class="fg-admin-action" id="ad-close-day" aria-label="Chiudi">×</button></div><p class="fg-admin-sub">Seleziona le piste disponibili in questa data. Senza piste selezionate, il giorno non sarà prenotabile.</p><div class="fg-admin-track-choices">'+(options||'<p>Prima aggiungi una pista in “Piste e listino”.</p>')+'</div><button class="fg-admin-action red" id="ad-save-day">Salva piste</button>'+(booked.length?'<div class="fg-admin-modal-bookings"><h2>Clienti prenotati · '+booked.length+'</h2><div class="fg-admin-list">'+cards+'</div><p class="fg-admin-sub">Le richieste già inviate restano nello storico anche se cambi le piste disponibili.</p></div>':'')+'</section></div>'}
function calendar(forFede=false){let today=key(new Date().getFullYear(),new Date().getMonth(),new Date().getDate()),byDate=new Map();for(const r of ((role==='owner'||role==='admin')?allBookings():requests)){if(r.status==='rejected'||r.status==='cancelled'||!r.date)continue;const group=byDate.get(r.date)||[];group.push(r);byDate.set(r.date,group)}let cards=months.map((name,m)=>{let offset=(new Date(year,m,1).getDay()+6)%7,count=new Date(year,m+1,0).getDate(),cells=week.map(w=>'<div class="fg-admin-weekday">'+w+'</div>').join('')+Array.from({length:offset},()=>'<div class="fg-admin-empty"></div>').join('');for(let d=1;d<=count;d++){let k=key(year,m,d),on=!!availability[k],entries=byDate.get(k)||[],confirmed=entries.some(r=>r.status==='confirmed'),state=confirmed?'booked':entries.length?'pending':on?'on':'';cells+='<button class="fg-admin-day '+state+'" data-ad-day="'+k+'" '+(k<today&&!entries.length?'disabled':'')+' title="'+k+(entries.length?' · '+entries.length+' '+(confirmed?'prenotazioni confermate':'richieste in attesa'):on?' disponibile':' non disponibile')+'">'+d+(entries.length?'<small>'+entries.length+'</small>':'')+'</button>'}return '<section class="fg-admin-month"><h3>'+name+'</h3><div class="fg-admin-days">'+cells+'</div></section>'}).join('');return (forFede?'<h2>Calendario presenze</h2>':'<h1>CALENDARIO</h1>')+'<p class="fg-admin-sub">Tocca un giorno occupato per vedere il cliente e la pista. Nei giorni liberi puoi cambiare la disponibilità.</p><div class="fg-admin-legend"><span><i class="available"></i>Disponibile</span><span><i class="pending"></i>Richiesta in attesa</span><span><i class="booked"></i>Prenotazione confermata</span></div><div class="fg-admin-year"><button class="fg-admin-action" id="ad-prev">‹</button><strong>'+year+'</strong><button class="fg-admin-action" id="ad-next">›</button></div>'+'<div class="fg-admin-months">'+cards+'</div>'+dayModal()}
function allBookings(){const used=new Set(requests.map(r=>[r.userId,r.date,r.track].join('|')));return requests.map(r=>({...r,source:'request'})).concat(legacy.filter(b=>!used.has([b.userId,b.date,b.track].join('|'))).map(b=>({...b,status:'confirmed',source:'legacy'}))).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')))}
function bookings(){let rows=allBookings().filter(r=>filter==='all'||(filter==='pending'?r.status==='pending':r.status==='confirmed'));let html=rows.map(r=>{let p=profiles[r.userId]||{},name=[p.name,p.surname].filter(Boolean).join(' ')||r.customerName||r.customerEmail||r.userEmail||r.email||'Pilota non indicato',mail=r.customerEmail||r.userEmail||r.email||p.email||'',status=r.status==='confirmed'?'Confermata':r.status==='rejected'?'Rifiutata':'In attesa di Fede';return '<article class="fg-admin-item"><div><small>'+esc(dateLabel(r.date))+' · '+esc(r.track||'Pista non indicata')+'</small><h3>'+esc(name)+'</h3><small>'+esc(mail)+(p.phone?' · '+esc(p.phone):'')+(p.bike?' · '+esc(p.bike):'')+'</small></div><span class="fg-admin-badge '+esc(r.status||'pending')+'">'+status+'</span></article>'}).join('');return '<h1>PRENOTAZIONI</h1><p class="fg-admin-sub">Qui vedi chi ha richiesto o prenotato un’uscita, in quale data e in quale pista. Le richieste diventano confermate solo dopo l’approvazione di Fede.</p><div class="fg-admin-row"><select id="ad-booking-filter"><option value="all">Tutte</option><option value="pending">In attesa</option><option value="confirmed">Confermate</option></select><strong>'+rows.length+' risultati</strong></div><div class="fg-admin-list">'+(html||'<div class="fg-admin-panel">Nessuna prenotazione per questo filtro.</div>')+'</div>'}
function catalog(){let t=tracks.map(x=>'<div class="fg-admin-item"><b>'+esc(x.name)+'</b><span class="fg-admin-item-actions"><button data-edit-track="'+x.id+'">Modifica</button><button data-del-track="'+x.id+'">Elimina</button></span></div>').join(''),s=services.map(x=>'<div class="fg-admin-item"><div><b>'+esc(x.name)+'</b><br><small>'+esc(x.description||'')+'</small></div><span>€ '+Number(x.price||0).toFixed(2)+' <span class="fg-admin-item-actions"><button data-edit-service="'+x.id+'">Modifica</button><button data-del-service="'+x.id+'">Elimina</button></span></span></div>').join('');return '<h1>PISTE E LISTINO</h1><p class="fg-admin-sub">Gestisci le piste selezionabili dai clienti e i prezzi delle lavorazioni.</p><section class="fg-admin-panel"><h2>Piste</h2><div class="fg-admin-row"><input id="ad-track-name" placeholder="Nome pista"><button class="fg-admin-action red" id="ad-add-track">Aggiungi pista</button></div><div class="fg-admin-list">'+(t||'Nessuna pista inserita.')+'</div></section><section class="fg-admin-panel"><h2>Lavorazioni</h2><div class="fg-admin-row"><input id="ad-service-name" placeholder="Lavorazione"><input id="ad-service-price" type="number" min="0" step="0.01" placeholder="Prezzo €"><input id="ad-service-desc" placeholder="Descrizione"><button class="fg-admin-action red" id="ad-add-service">Aggiungi</button></div><div class="fg-admin-list">'+(s||'Nessuna lavorazione inserita.')+'</div></section>'}

function userRecords(){return Object.entries(profiles).map(([id,p])=>({id,p:p||{}})).sort((a,b)=>{const an=[a.p.surname,a.p.name,a.p.email].filter(Boolean).join(' '),bn=[b.p.surname,b.p.name,b.p.email].filter(Boolean).join(' ');return an.localeCompare(bn,'it',{sensitivity:'base'})})}
function userDetail(id){const p=profiles[id];if(!p)return '<section class="fg-admin-panel"><p class="fg-admin-sub">Seleziona un utente per vedere la scheda.</p></section>';const name=[p.name,p.surname].filter(Boolean).join(' ')||p.email||'Cliente senza nome',history=Array.isArray(p.bikeHistory)?p.bikeHistory.map(x=>typeof x==='string'?{name:x,owned:true}:x).filter(x=>x&&x.name):[],current=Array.isArray(p.bikes)?p.bikes:history.length?history.filter(x=>x.owned!==false).map(x=>x.name):p.bike?[p.bike]:[],past=history.filter(x=>x.owned===false).map(x=>x.name),fields=[['Nome',p.name],['Cognome',p.surname],['Email',p.email],['Telefono',p.phone],['Indirizzo',p.address],['Città',p.city],['Nazione',p.nationality],['Ranking',p.ranking],['Peso',p.weight?p.weight+' kg':''],['Altezza',p.height?p.height+' cm':'']];const cells=fields.map(([label,value])=>'<div class="fg-admin-user-field"><small>'+esc(label)+'</small><b>'+esc(value||'—')+'</b></div>').join(''),bikeList=x=>x.length?x.map(v=>'<div class="fg-admin-user-field"><b>'+esc(v)+'</b></div>').join(''):'<p class="fg-admin-sub">Nessuna moto.</p>';return '<section class="fg-admin-panel"><h2>'+esc(name)+'</h2><div class="fg-admin-user-fields">'+cells+'</div><h2 style="margin-top:24px">Moto in possesso</h2><div class="fg-admin-user-fields">'+bikeList(current)+'</div><h2 style="margin-top:24px">Moto non più in possesso</h2><div class="fg-admin-user-fields">'+bikeList(past)+'</div></section>'}
function usersView(){const rows=userRecords();if(!profiles[selectedUser])selectedUser=rows[0]?.id||'';const cards=rows.map(({id,p})=>{const name=[p.name,p.surname].filter(Boolean).join(' ')||p.email||'Cliente senza nome',search=[name,p.email,p.phone,p.city,p.bike,...(Array.isArray(p.bikes)?p.bikes:[])].filter(Boolean).join(' ').toLocaleLowerCase('it');return '<button type="button" class="fg-admin-user-row '+(selectedUser===id?'active':'')+'" data-user-id="'+esc(id)+'" data-search="'+esc(search)+'"><b>'+esc(name)+'</b><small>'+esc(p.email||'Email non indicata')+'</small><small>'+esc(p.phone||'Telefono non indicato')+'</small></button>'}).join('');return '<h1>UTENTI REGISTRATI</h1><p class="fg-admin-sub">Profili dei clienti registrati sul sito. Seleziona un nome per vedere tutti i dati e lo storico delle moto.</p><div class="fg-admin-row"><input id="ad-user-search" type="search" placeholder="Cerca nome, email, telefono o moto" aria-label="Cerca utenti"><strong id="ad-user-count"></strong></div><div class="fg-admin-users-layout"><div class="fg-admin-user-list">'+(cards||'<section class="fg-admin-panel">Nessun profilo cliente registrato.</section>')+'</div>'+userDetail(selectedUser)+'</div>'}
function bindUsers(){const search=root.querySelector('#ad-user-search'),count=root.querySelector('#ad-user-count'),rows=[...root.querySelectorAll('[data-user-id]')];search.value=userQuery;const filter=()=>{const term=search.value.trim().toLocaleLowerCase('it');let shown=0;rows.forEach(row=>{const yes=row.dataset.search.includes(term);row.style.display=yes?'':'none';if(yes)shown++});count.textContent=shown+' / '+rows.length+' utenti'};search.oninput=()=>{userQuery=search.value;filter()};rows.forEach(row=>row.onclick=()=>{selectedUser=row.dataset.userId;render()});filter()}
function unifiedCalendar(){let pending=requests.filter(r=>r.status==='pending').sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));let cards=pending.map(r=>{let p=profiles[r.userId]||{},name=[p.name,p.surname].filter(Boolean).join(' ')||r.customerName||r.customerEmail||r.userEmail||'Pilota non indicato';return '<article class="fg-admin-item"><div><small>'+esc(dateLabel(r.date))+' · '+esc(r.track||'Pista non indicata')+'</small><h3>'+esc(name)+'</h3><small>'+esc(r.customerEmail||r.userEmail||p.email||'')+'</small></div><div class="fg-admin-item-actions"><button class="fg-admin-action red" data-fede-decision="confirmed" data-request="'+esc(r.id)+'">Conferma</button><button class="fg-admin-action" data-fede-decision="rejected" data-request="'+esc(r.id)+'">Rifiuta</button></div></article>'}).join('');let setting=role==='owner'?'<section class="fg-admin-panel"><h2>Account admin Fede</h2><p class="fg-admin-sub">L’account '+esc(fedeAdminEmail)+' avrà gli stessi menu di gestione, ma solo dopo il cambio della password e la tua attivazione.</p><p>Stato: <b>'+(settings.fedeAdminActive?'Attivo':'In attesa di attivazione')+'</b></p>'+(settings.fedeAdminActive?'<button class="fg-admin-action" id="ad-deactivate-fede">Disattiva accesso admin</button>':'<label class="fg-admin-track-choice"><input id="ad-password-verified" type="checkbox">Fede mi ha confermato di aver cambiato la password</label><button class="fg-admin-action red" id="ad-activate-fede" disabled>Attiva account admin</button>')+'</section>':'';return '<h1>CALENDARIO</h1><p class="fg-admin-sub">Gestisci date e piste, visualizza i clienti prenotati e conferma o rifiuta le richieste.</p><section class="fg-admin-panel"><h2>Richieste da confermare · '+pending.length+'</h2><div class="fg-admin-list">'+(cards||'<p>Nessuna richiesta in attesa.</p>')+'</div></section>'+setting+'<section class="fg-admin-panel">'+calendar(true)+'</section>'}
function render(){if(!root)return;root.querySelectorAll('[data-ad-tab]').forEach(b=>b.classList.toggle('active',b.dataset.adTab===tab));let view=root.querySelector('#fg-admin-content');view.innerHTML=(tab==='calendar'?unifiedCalendar():tab==='bookings'?bookings():tab==='users'?usersView():catalog())+'<div class="fg-admin-notice" id="fg-admin-notice" role="status">'+esc(notice||'')+'</div>';if(tab==='calendar'){bindCalendar();bindFede()}if(tab==='bookings'){let f=view.querySelector('#ad-booking-filter');f.value=filter;f.onchange=()=>{filter=f.value;render()}}if(tab==='catalog')bindCatalog();if(tab==='users')bindUsers();}
function bindCalendar(){root.querySelector('#ad-prev').onclick=()=>{year--;selectedDay='';render()};root.querySelector('#ad-next').onclick=()=>{year++;selectedDay='';render()};root.querySelectorAll('[data-ad-day]').forEach(b=>b.onclick=()=>{selectedDay=b.dataset.adDay;render();root.querySelector('#ad-day-modal')?.focus()});const close=()=>{selectedDay='';render()};const closeButton=root.querySelector('#ad-close-day');if(closeButton)closeButton.onclick=close;const backdrop=root.querySelector('#ad-day-modal-backdrop');if(backdrop)backdrop.onclick=e=>{if(e.target===backdrop)close()};const save=root.querySelector('#ad-save-day');if(save)save.onclick=async()=>{const day=selectedDay,ids=[...root.querySelectorAll('[data-ad-track]:checked')].map(x=>x.value);save.disabled=true;try{await setDoc(doc(db,'availability',day),{date:day,available:ids.length>0,trackIds:ids,updatedAt:serverTimestamp()},{merge:true});selectedDay='';render();message(ids.length?'Piste salvate per '+day+'.':day+' reso non disponibile.')}catch(e){save.disabled=false;message('Impossibile salvare le piste: '+(e.code||'errore Firebase'))}}}
async function run(action,success){try{await action();message(success)}catch(e){message('Salvataggio non riuscito: '+(e.code||'errore Firebase'))}}
function bindCatalog(){root.querySelector('#ad-add-track').onclick=()=>{let name=root.querySelector('#ad-track-name').value.trim();if(!name)return message('Inserisci il nome della pista.');if(tracks.some(x=>x.name?.toLowerCase()===name.toLowerCase()))return message('Questa pista è già presente.');run(()=>addDoc(collection(db,'tracks'),{name,createdAt:serverTimestamp()}),'Pista aggiunta.')};root.querySelector('#ad-add-service').onclick=()=>{let name=root.querySelector('#ad-service-name').value.trim(),raw=root.querySelector('#ad-service-price').value,price=Number(raw),description=root.querySelector('#ad-service-desc').value.trim();if(!name||raw===''||!Number.isFinite(price)||price<0)return message('Inserisci lavorazione e prezzo valido.');run(()=>addDoc(collection(db,'services'),{name,price,description,createdAt:serverTimestamp()}),'Lavorazione aggiunta.')};root.querySelectorAll('[data-edit-track]').forEach(b=>b.onclick=()=>{let x=tracks.find(t=>t.id===b.dataset.editTrack),name=prompt('Nome pista',x.name);if(name?.trim())run(()=>updateDoc(doc(db,'tracks',x.id),{name:name.trim()}),'Pista aggiornata.')});root.querySelectorAll('[data-del-track]').forEach(b=>b.onclick=()=>{let x=tracks.find(t=>t.id===b.dataset.delTrack);if(confirm('Eliminare la pista '+x.name+'?'))run(()=>deleteDoc(doc(db,'tracks',x.id)),'Pista eliminata.')});root.querySelectorAll('[data-edit-service]').forEach(b=>b.onclick=()=>{let x=services.find(t=>t.id===b.dataset.editService),name=prompt('Lavorazione',x.name);if(!name?.trim())return;let raw=prompt('Prezzo €',x.price);if(raw===null||raw.trim()===''||!Number.isFinite(Number(raw))||Number(raw)<0)return;let description=prompt('Descrizione',x.description||'');if(description===null)return;run(()=>updateDoc(doc(db,'services',x.id),{name:name.trim(),price:Number(raw),description}),'Lavorazione aggiornata.')});root.querySelectorAll('[data-del-service]').forEach(b=>b.onclick=()=>{let x=services.find(t=>t.id===b.dataset.delService);if(confirm('Eliminare la lavo function bindFede(){root.querySelectorAll('[data-fede-decision]').forEach(b=>b.onclick=async()=>{const id=b.dataset.request,status=b.dataset.fedeDecision;b.disabled=true;await run(()=>updateDoc(doc(db,'bookingRequests',id),{status,reviewedAt:serverTimestamp()}),status==='confirmed'?'Richiesta confermata.':'Richiesta rifiutata.');b.disabled=false});const check=root.querySelector('#ad-password-verified'),activate=root.querySelector('#ad-activate-fede');if(check&&activate){check.onchange=()=>{activate.disabled=!check.checked};activate.onclick=()=>run(()=>setDoc(doc(db,'settings','booking'),{fedeAdminActive:true},{merge:true}),'Accesso admin di Fede attivato.')};const deactivate=root.querySelector('#ad-deactivate-fede');if(deactivate)deactivate.onclick=()=>{if(confirm('Disattivare l’accesso admin di Fede?'))run(()=>setDoc(doc(db,'settings','booking'),{fedeAdminActive:false},{merge:true}),'Accesso admin di Fede disattivato.')}}

onAuthStateChanged(auth,u=>{stops.forEach(f=>f());stops=[];root?.remove();root=null;role=null;delete document.body.dataset.fgAdmin;if(!u)return;const email=String(u.email||'').toLowerCase();let feedsStarted=false;watch(doc(db,'settings','booking'),s=>{settings=s.data()||{};const next=email===owner?'owner':u.uid===fedeAdminUid?(settings.fedeAdminActive?'admin':'pending_admin'):email===String(settings.fedeEmail||'').toLowerCase()?'fede':null;if(!next){root?.remove();root=null;role=null;delete document.body.dataset.fgAdmin;return}if(role==='admin'&&next==='pending_admin'){signOut(auth);return}if(role!==next||!root){role=next;tab='calendar';mount()}else if(tab==='calendar'&&role!=='pending_admin')render();if(next==='pending_admin'||feedsStarted)return;feedsStarted=true;watch(collection(db,'availability'),s=>{availability={};dateTracks={};s.forEach(d=>{availability[d.id]=!!d.data().available;dateTracks[d.id]=Array.isArray(d.data().trackIds)?d.data().trackIds:null});if(tab==='calendar')render()});watch(collection(db,'bookingRequests'),s=>{requests=s.docs.map(d=>({id:d.id,...d.data()}));if(tab==='calendar'||tab==='bookings')render()});watch(collection(db,'tracks'),s=>{tracks=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.name).localeCompare(String(b.name)));if(tab==='calendar'||tab==='catalog')render()});if(role==='owner'||role==='admin'){watch(collection(db,'bookings'),s=>{legacy=s.docs.map(d=>({id:d.id,...d.data()}));if(tab==='calendar'||tab==='bookings')render()});watch(collection(db,'profiles'),s=>{profiles={};s.forEach(d=>{profiles[d.id]=d.data()});if(tab==='calendar'||tab==='bookings'||tab==='users')render()});watch(collection(db,'services'),s=>{services=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.name).localeCompare(String(b.name)));if(tab==='catalog')render()})}})})
}
