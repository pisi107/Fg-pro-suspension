raw(){let q=el('q').value.toLowerCase(),y=el('year').value;let a=records.filter(r=>(!y||r.year==y)&&JSON.stringify(r).toLowerCase().includes(q));el('list').innerHTML=a.length?a.map(r=>'<div class="record '+(r.id==state.id?'active':'')+'" onclick="pick('+r.id+')"><div class="tag">'+r.year+'</div><h3>'+r.model+'</h3><small>Rider: '+r.rider+'</small></div>').join(''):'<div class="empty">Nessun setup.</div>';let r=a.find(x=>x.id==state.id)||a[0];if(!r){el('detail').innerHTML='<div class="empty">Seleziona un setup.</div>';return}state.id=r.id;if(!r[state.part][state.variant])state.variant=variants(r)[0];let s=r[state.part][state.variant];el('detail').innerHTML='<div class="panel-head"><div><div class="tag">'+r.year+' · '+r.rider+'</div><h2>'+r.model+'</h2></div><div class="tabs"><button class="'+(state.part=='fork'?'active':'')+'" onclick="selectPart(&quot;fork&quot;)">Forcella</button><button class="'+(state.part=='shock'?'active':'')+'" onclick="selectPart(&quot;shock&quot;)">Mono</button>'+variants(r).map(v=>'<button class="'+(state.variant==v?'active':'')+'" onclick="variant(&quot;'+v+'&quot;)">'+v+'</button>').join('')+'</div></div><div class="content"><div class="stacks">'+[['Rebound',s.reb],['Mid Speed',s.mid],['Compression',s.comp],['Low Speed',s.low]].map(x=>'<section class="stack"><h3>'+x[0]+'</h3><pre>'+x[1]+'</pre></section>').join('')+'</div><div class="specs">'+s.spec.map(x=>'<div class="spec"><small>'+x[0]+'</small><b>'+x[1]+'</b></div>').join('')+'</div><div class="notes"><b>NOTE E REVISIONI</b><br>'+r.notes+'</div></div>'}function pick(i){state.id=i;state.part='fork';state.variant='STD';draw()}function selectPart(p){state.part=p;state.variant='STD';draw()}function variant(v){state.variant=v;draw()}let ys=[...new Set(records.map(r=>r.year))].sort();el('year').innerHTML+='<option>'+ys.join('</option><option>')+'</option>';el('q').oninput=draw;el('year').onchange=draw;el('new').onclick=()=>{let rider=prompt('Nome rider');let year=prompt('Anno moto');let mod wait createUserWithEmailAndPassword(auth,d.email,$('pass').value);await setDoc(doc(db,'profiles',r.user.uid),Object.assign(d,{createdAt:serverTimestamp()}))}catch(x){$('notice').textContent='Errore: '+x.message}}}function cards(){return dates.length?dates.map(d=>'<div class="stack"><div class="tag">'+safe(d.date)+'</div><h3>'+safe(d.track)+'</h3><p>Posti rimasti: <b>'+Math.max(0,d.capacity-d.booked)+'</b> / '+d.capacity+'</p>'+(d.booked<d.capacity?'<button class="btn red" data-id="'+d.id+'">PRENOTA</button>':'<b>COMPLETO</b>')+'</div>').join(''):'<div class="empty">Nessuna uscita pubblicata.</div>'}function customer(){page('<section class="panel" style="margin-top:18px"><div class="content"><div class="tag">Area cliente</div><h2>USCITE DISPONIBILI</h2><div class="stacks" id="dateList">Caricamento…</div><p><button class="btn" id="logout">ESCI</button></p><div class="notes" id="notice">Scegli la pista e la data desiderata.</div></div></section>');$('logout').onclick=()=>signOut(auth);onSnapshot(query(collection(db,'events'),orderBy('date')),s=>{dates=s.docs.map(x=>Object.assign({id:x.id},x.data()));$('dateList').innerHTML=cards();document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>reserve(b.dataset.id))})}async function reserve(id){let d=dates.find(x=>x.id===id);if(!d||!confirm('Confermi '+d.date+' - '+d.track+'?'))return;try{await runTransaction(db,async t=>{let ref=doc(db,'events',id),snap=await t.get(ref),x=snap.data();if(x.booked>=x.capacity)throw Error('Posti esauriti');t.update(ref,{booked:x.booked+1});t.set(doc(db,'bookings',me.uid+'_'+id),{userId:me.uid,eventId:id,date:x.date,track:x.track,createdAt:serverTimestamp()})});$('notice').textContent='Prenotazione confermata.'}catch(x){$('notice').textContent='Impossibile prenotare: '+x.message}}function manager(){page('<section class="panel" style="margin-top:18px"><div class="content"><div class="tag">Gestione FG Pro</div><h2>PUBBLICA UN’USCITA</h2><div class="specs"><input id="date" type="date"><input <script type="module">
import{getApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import{getFirestore,collection,query,orderBy,onSnapshot}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const trackDb=getFirestore(getApp());

connectTrackPicker();
</script>
