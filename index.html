<script type="module">
import{getApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';

const profileAuth=getAuth(getApp()),profileDb=getFirestore(getApp()),adminEmail='giorgio.bruno107@gmail.com';
const bikeCatalog={KTM:['125 SX','150 SX','250 SX','250 SX-F','350 SX-F','450 SX-F'],Husqvarna:['TC 125','TC 250','FC 250','FC 350','FC 450'],GasGas:['MC 125','MC 250','MC 250F','MC 350F','MC 450F'],Honda:['CRF 250R','CRF 450R'],Yamaha:['YZ 125','YZ 250','YZ 250F','YZ 450F'],Kawasaki:['KX 250','KX 450'],Suzuki:['RM-Z 250','RM-Z 450'],Fantic:['XX 125','XX 250','XX 250F','XX 450F'],Beta:['RX 250 2T','RX 300 2T','RX 250 4T','RX 350 4T','RX 450 4T'],'TM Racing':['MX 125','MX 144','MX 250','MX 250F','MX 300','MX 450F'],Sherco:['SE 125','SE 250','SE 300','SEF 250','SEF 300','SEF 450'],Ducati:['Desmo450 MX'],Altro:['Altro modello']};
const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function render(){if(!activeUser||activeUser.email===adminEmail)return;const el=slot();if(!el)return;const d=activeData,bikes=Array.isArray(d.bikes)?d.bikes:(d.bike?[d.bike]:[]),info=[['Nome',d.name],['Cognome',d.surname],['Indirizzo',d.address],['Nazione',d.nationality],['Ranking',d.ranking],['Peso',d.weight?d.weight+' kg':''],['Altezza',d.height?d.height+' cm':''],['Email',d.email||activeUser.email]];el.innerHTML='<div class="panel"><div class="content"><div class="tag">Area clienti</div><h2>I TUOI DATI</h2><div class="specs">'+info.map(x=>'<div class="record" style="cursor:default"><small>'+esc(x[0])+'</small><h3>'+esc(x[1])+'</h3></div>').join('')+'</div><div class="tag" style="margin-top:22px">Le tue moto</div><div class="list" style="margin-top:10px">'+(bikes.length?bikes.map((b,i)=>'<div class="record" style="display:flex;justify-content:space-between;gap:12px;align-items:center"><h3>'+esc(b)+'</h3><button class="btn" data-remove-bike="'+i+'">ELIMINA</button></div>').join(''):'<p class="notes">Non hai ancora aggiunto una moto.</p>')+'</div><p><button class="btn red" id="add-bike">AGGIUNGI MOTO</button></p><div id="bike-form"></div></div></div>'}

<script type="module">
import{getApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import{getAuth}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import{getFirestore,doc,getDoc,setDoc}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const historyAuth=getAuth(getApp()),historyDb=getFirestore(getApp()),historyAdmin='giorgio.bruno107@gmail.com';
function legacyHistory(data,live){return Array.isArray(data.bikeHistory)?data.bikeHistory.map(x=>typeof x==='string'?{name:x,owned:true}:x):live.map(name=>({name,owned:true}))}
function summary(live,hist){const old=hist.filter(x=>x.owned===false).map(x=>x.name+' (NON PIÙ IN POSSESSO)');return [...live,...old].join(' • ')}
document.addEventListener('click',async e=>{
  const button=e.target.closest?.('#save-bike,[data-remove-bike]');
  if(!button)return;
  const u=historyAuth.currentUser;
  if(!u||u.email===historyAdmin)return;
  e.preventDefault();e.stopImmediatePropagation();
  const ref=doc(historyDb,'profiles',u.uid),data=(await getDoc(ref)).data()||{};
  let live=Array.isArray(data.bikes)?[...data.bikes]:(data.bike?[data.bike]:[]),hist=legacyHistory(data,live);
  if(button.id==='save-bike'){
    const brand=document.getElementById('pb')?.value,model=document.getElementById('pm')?.value,year=document.getElementById('py')?.value;
    if(!brand||!model||!year)return;
    const name=brand+' '+model+' '+year;live.push(name);hist.push({name,owned:true});
  }else{
    const index=Number(button.dataset.removeBike),name=live[index];
    if(!name)return;
    live.splice(index,1);
    const row=[...hist].reverse().find(x=>x.name===name&&x.owned!==false);
    if(row)row.owned=false;
  }
  await setDoc(ref,{bikes:live,bikeHistory:hist,bike:summary(live,hist)},{merge:true});
},true);
</script>

import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import{getFirestore,doc,setDoc,serverTimestamp,onSnapshot}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const cityAuth=getAuth(getApp()),cityDb=getFirestore(getApp());
function installCity(){
  const address=document.getElementById('ad');
  if(address&&!document.getElementById('ct')){const city=document.createElement('input');city.id='ct';city.placeholder='Città';address.after(city)}
  const create=document.getElementById('cr');
  if(create&&!create.dataset.cityReady){create.dataset.cityReady='1';create.onclick=async()=>{const v=x=>document.getElementById(x).value.trim(),p=document.getElementById('pa').value,nt=document.getElementById('nt');const o={name:v('n'),surname:v('s'),address:v('ad'),city:v('ct'),nationality:document.getElementById('na').value,ranking:document.getElementById('ra').value,bike:v('bi'),weight:v('we'),height:v('he'),email:v('em')};if(Object.values(o).some(x=>!x))return nt.textContent='Completa tutti i campi.';if(!/^(?=.{6,})(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9])/.test(p))return nt.textContent='Password: minimo 6 caratteri, maiuscola, numero e carattere speciale.';try{const u=await createUserWithEmailAndPassword(cityAuth,o.email,p);await setDoc(doc(cityDb,'profiles',u.user.uid),{...o,createdAt:serverTimestamp()})}catch(e){nt.textContent='Errore: '+e.message}}}
}
function showCity(data){const specs=document.querySelector('#client-profile .specs');if(!specs||document.getElementById('city-profile'))return;const city=document.createElement('div');city.id='city-profile';city.className='record';city.style.cursor='default';city.innerHTML='<small>Città</small><h3>'+String(data.city||'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))+'</h3>';specs.append(city)}
new MutationObserver(installCity).observe(document.body,{childList:true,subtree:true});installCity();
onAuthStateChanged(cityAuth,u=>{if(!u)return;onSnapshot(doc(cityDb,'profiles',u.uid),s=>{const data=s.data()||{};new MutationObserver(()=>showCity(data)).observe(document.body,{childList:true,subtree:true});showCity(data)})});
</script>

<script>
(()=>{
  function extendYears(){document.querySelectorAll('#bikeYear,#py').forEach(s=>{if(s.dataset.years1970)return;s.dataset.years1970='1';for(let y=1989;y>=1970;y--){const o=document.createElement('option');o.value=o.textContent=y;s.append(o)}})}
  function customFields(brand,model){
    const isOther=brand.options[brand.selectedIndex]?.text==='Altro';
    let box=document.getElementById('other-bike-fields');
    if(!isOther){if(box)box.remove();return}
    if(!box){box=document.createElement('div');box.id='other-bike-fields';box.style.cssText='display:contents';box.innerHTML='<input id="otherBrand" placeholder="Specifica marca"><input id="otherModel" placeholder="Specifica modello">';model.after(box)}
    const b=document.getElementById('otherBrand'),m=document.getElementById('otherModel');
    const sync=()=>{const opt=brand.options[brand.selectedIndex];if(!opt)return;opt.value=b.value.trim()||'Altro';if(m.value.trim()){model.innerHTML='<option value="'+m.value.replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'">'+m.value.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</option>';model.value=m.value.trim()}if(brand.id==='bikeBrand'){const year=document.getElementById('bikeYear'),hidden=document.getElementById('bi');if(hidden)hidden.value=b.value.trim()&&m.value.trim()&&year?.value?b.value.trim()+' '+m.value.trim()+' '+year.value:''}};
    b.oninput=m.oninput=sync;document.getElementById(brand.id==='bikeBrand'?'bikeYear':'py')?.addEventListener('change',sync);sync()
  }
  document.addEventListener('change',e=>{if(e.target.id==='bikeBrand'||e.target.id==='pb')queueMicrotask(()=>{extendYears();customFields(e.target,document.getElementById(e.target.id==='bikeBrand'?'bikeModel':'pm'))})},true);
  new MutationObserver(()=>extendYears()).observe(document.body,{childList:true,subtree:true});extendYears();
})();
</script>

<script type="module" id="booking-approval-flow">
import{getApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import{getAuth,onAuthStateChanged,signOut,updatePassword}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import{getFirestore,collection,doc,getDoc,setDoc,updateDoc,addDoc,onSnapshot,query,where,serverTimestamp,runTransaction}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const flowAuth=getAuth(getApp()),flowDb=getFirestore(getApp()),flowRoot=document.querySelector('.app'),ownerEmail='giorgio.bruno107@gmail.com';let flowUser=null,flowEvents=[],flowRequests=[],stopEvents,stopRequests;
const clean=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hero(title,copy){return '<section class="hero"><div><div class="eyebrow">FG PRO BOOKING</div><h1>'+title+'</h1></div><div>'+copy+'</div></section>'}
function stop(){if(stopEvents)stopEvents();if(stopRequests)stopRequests();stopEvents=stopRequests=null}
function watchEvents(render){if(stopEvents)stopEvents();stopEvents=onSnapshot(collection(flowDb,'events'),s=>{flowEvents=s.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>String(a.date).localeCompare(String(b.date)));render()})}
function homeFlow(){stop();flowRoot.innerHTML=hero('AREA<br><b>CLIENTI</b>','Accedi o registrati per inviare una richiesta di uscita.')+'<section class="panel" style="margin-top:18px"><div class="content"><div class="tag">Prenotazioni</div><h2>ACCEDI O REGISTRATI</h2><p class="notes">Dopo l’accesso scegli data e pista. La prenotazione sarà valida soltanto dopo la conferma di Fede.</p><p><button class="btn red" id="flow-login">ACCEDI O REGISTRATI</button></p></div></section>';document.getElementById('flow-login').onclick=()=>[...document.querySelectorAll('.nav button')].find(b=>b.textContent.trim()==='AREA CLIENTI')?.click()}
function clientFlow(){stop();const render=()=>{const mine=new Map(flowRequests.map(x=>[x.eventId,x]));const available=flowEvents.filter(x=>x.fedePresent===true);flowRoot.innerHTML=hero('LE TUE<br><b>USCITE</b>','Invia la richiesta: Fede dovrà confermarla.')+'<section class="panel" style="margin-top:18px"><div class="content"><div class="tag">Date disponibili</div><h2>SCEGLI DATA E PISTA</h2><div class="stacks">'+(available.length?available.map(e=>{const r=mine.get(e.id),left=Math.max(0,Number(e.capacity||0)-Number(e.booked||0));return '<article class="stack"><div class="tag">'+clean(e.date)+'</div><h3>'+clean(e.track)+'</h3><p>Posti confermati: '+(e.booked||0)+' / '+(e.capacity||'—')+'</p>'+(r?'<p class="notes"><b>Stato:</b> '+(r.status==='pending'?'IN ATTESA DI CONFERMA':r.status==='confirmed'?'CONFERMATA':'RIFIUTATA')+'</p>':left>0?'<button class="btn red" data-request="'+e.id+'">INVIA RICHIESTA</button>':'<p class="notes">POSTI ESAURITI</p>')+'</article>'}).join(''):'<p class="notes">Nessuna uscita disponibile in questo momento.</p>')+'</div><p><button class="btn" id="flow-out">ESCI</button></p></div></section>';document.getElementById('flow-out').onclick=()=>signOut(flowAuth);document.querySelectorAll('[data-request]').forEach(b=>b.onclick=()=>sendRequest(b.dataset.request))};watchEvents(render);stopRequests=onSnapshot(query(collection(flowDb,'bookingRequests'),where('userId','==',flowUser.uid)),s=>{flowRequests=s.docs.map(x=>({id:x.id,...x.data()}));render()})}
async function sendRequest(eventId){const e=flowEvents.find(x=>x.id===eventId);if(!e)return;const old=flowRequests.find(x=>x.eventId===eventId);if(old)return;const profile=(await getDoc(doc(flowDb,'profiles',flowUser.uid))).data()||{};await setDoc(doc(flowDb,'bookingRequests',flowUser.uid+'_'+eventId),{eventId,userId:flowUser.uid,status:'pending',date:e.date,track:e.track,customerName:(profile.name||'')+' '+(profile.surname||''),customerEmail:flowUser.email,bike:profile.bike||'',createdAt:serverTimestamp()})}
function fedeFlow(){stop();const render=()=>{const pending=flowRequests.filter(x=>x.status==='pending');flowRoot.innerHTML=hero('AREA<br><b>FEDE</b>','Indica le presenze e conferma le richieste dei clienti.')+'<section class="panel" style="margin-top:18px"><div class="content"><div class="tag">Calendario</div><h2>LE TUE PRESENZE</h2><div class="stacks">'+(flowEvents.length?flowEvents.map(e=>'<article class="stack"><div class="tag">'+clean(e.date)+'</div><h3>'+clean(e.track)+'</h3><p><button class="btn '+(e.fedePresent?'red':'')+'" data-present="'+e.id+'">'+(e.fedePresent?'PRESENTE':'NON DISPONIBILE')+'</button></p></article>').join(''):'<p class="notes">Nessuna uscita programmata.</p>')+'</div><div class="tag" style="margin-top:24px">Richieste ricevute</div><h2>DA CONFERMARE</h2><div class="stacks">'+(pending.length?pending.map(r=>'<article class="stack"><div class="tag">'+clean(r.date)+' · '+clean(r.track)+'</div><h3>'+clean(r.customerName||r.customerEmail)+'</h3><p>Moto: '+clean(r.bike||'—')+'</p><p><button class="btn red" data-approve="'+r.id+'">CONFERMA</button> <button class="btn" data-reject="'+r.id+'">RIFIUTA</button></p></article>').join(''):'<p class="notes">Nessuna richiesta in attesa.</p>')+'</div><p><button class="btn" id="flow-out">ESCI</button></p></div></section>';document.getElementById('flow-out').onclick=()=>signOut(flowAuth);document.querySelectorAll('[data-present]').forEach(b=>b.onclick=()=>updateDoc(doc(flowDb,'events',b.dataset.present),{fedePresent:!flowEvents.find(x=>x.id===b.dataset.present).fedePresent}));document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>decide(b.dataset.approve,true));document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>decide(b.dataset.reject,false))};watchEvents(render);stopRequests=onSnapshot(collection(flowDb,'bookingRequests'),s=>{flowRequests=s.docs.map(x=>({id:x.id,...x.data()}));render()})}
async function decide(id,approved){const request=flowRequests.find(x=>x.id===id);if(!request)return;if(!approved){await updateDoc(doc(flowDb,'bookingRequests',id),{status:'rejected',decidedAt:serverTimestamp()});return}await runTransaction(flowDb,async t=>{const ev=doc(flowDb,'events',request.eventId),rs=doc(flowDb,'bookingRequests',id),event=(await t.get(ev)).data();if(!event||!event.fedePresent)throw Error('Fede non disponibile');if(Number(event.booked||0)>=Number(event.capacity||0))throw Error('Posti esauriti');t.update(ev,{booked:Number(event.booked||0)+1});t.update(rs,{status:'confirmed',decidedAt:serverTimestamp()})})}
function adminFlow(){stop();let eventNotice='';const render=()=>{flowRoot.innerHTML=hero('GESTIONE<br><b>USCITE</b>','Crea le date e assegna l’accesso a Fede.')+'<section class="panel" style="margin-top:18px"><div class="content"><div class="tag">Configurazione Fede</div><h2>AREA FEDE</h2><div class="specs"><input id="fede-email" type="email" placeholder="Email dell’account di Fede"><button class="btn red" id="save-fede">SALVA</button></div><p class="notes">Fede deve prima registrarsi con questa email.</p><div class="tag" style="margin-top:24px">Nuova uscita</div><h2>DATA E PISTA</h2><div class="specs"><input id="event-date" type="date"><input id="event-track" placeholder="Pista"><input id="event-capacity" type="number" min="1" value="10" placeholder="Posti"></div><p><button class="btn red" id="add-event">PUBBLICA USCITA</button></p><p class="notes" id="event-status">'+(eventNotice||'Inserisci data, pista e posti.')+'</p><div class="stacks">'+flowEvents.map(e=>'<article class="stack"><div class="tag">'+clean(e.date)+'</div><h3>'+clean(e.track)+'</h3><p>Fede: '+(e.fedePresent?'presente':'da indicare')+' · Confermati: '+(e.booked||0)+'/'+(e.capacity||'—')+'</p></article>').join('')+'</div><p><button class="btn" id="flow-out">ESCI</button></p></div></section>';document.getElementById('flow-out').onclick=()=>signOut(flowAuth);document.getElementById('save-fede').onclick=()=>setDoc(doc(flowDb,'settings','booking'),{fedeEmail:document.getElementById('fede-email').value.trim().toLowerCase()},{merge:true});document.getElementById('add-event').onclick=async()=>{const date=document.getElementById('event-date').value,track=document.getElementById('event-track').value.trim(),capacity=Number(document.getElementById('event-capacity').value);const status=document.getElementById('event-status'),button=document.getElementById('add-event');if(!date||!track||!Number.isInteger(capacity)||capacity<1){status.textContent='Inserisci una data, una pista e almeno un posto.';return}button.disabled=true;status.textContent='Pubblicazione in corso...';try{await addDoc(collection(flowDb,'events'),{date,track,capacity,booked:0,fedePresent:false,createdAt:serverTimestamp()});eventNotice='Uscita pubblicata.';render()}catch(e){eventNotice=e.code==='permission-denied'?'Firebase ha negato il salvataggio: verifica di aver effettuato l’accesso come amministratore.':'Salvataggio non riuscito. Riprova.';status.textContent=eventNotice}finally{button.disabled=false}}};watchEvents(render)}
onAuthStateChanged(flowAuth,async u=>{flowUser=u;if(!u)return homeFlow();if(u.email===ownerEmail)return adminFlow();const cfg=(await getDoc(doc(flowDb,'settings','booking'))).data()||{};if(String(cfg.fedeEmail||'').toLowerCase()===String(u.email||'').toLowerCase())fedeFlow();else clientFlow()});
</script>

<script type="module" id="fg-separated-portals">
import{getApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import{getAuth,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import{getFirestore,collection,doc,getDoc,setDoc,updateDoc,onSnapshot,query,where,serverTimestamp,runTransaction}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const fgAuth=getAuth(getApp()),fgDb=getFirestore(getApp()),fgRoot=document.querySelector('.app'),fgMode=new URLSearchParams(location.search).get('area')||'cliente';
let fgUser=null,fgEvents=[],fgRequests=[],stopEvents=null,stopRequests=null;
const fgEsc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fgHero=(eye,title,copy)=>'<section class="hero"><div><div class="eyebrow">'+eye+'</div><h1>'+title+'</h1></div><div>'+copy+'</div></section>';
function fgReset(){document.body.dataset.portal=fgMode;if(stopEvents)stopEvents();if(stopRequests)stopRequests();stopEvents=stopRequests=null;document.querySelectorAll('.nav button').forEach(b=>b.style.display='none')}
function fgLogin(){return [...document.querySelectorAll('.nav button')].find(b=>b.textContent.trim()==='AREA CLIENTI')}
function fgGuest(){fgReset();const fede=fgMode==='fede';fgRoot.innerHTML=fgHero(fede?'ACCESSO RISERVATO':'FG PRO SUSPENSION',fede?'AREA<br><b>FEDE</b>':'AREA<br><b>CLIENTI</b>',fede?'Calendario presenze e conferma richieste.':'Accedi o registrati per scegliere una data e una pista.')+'<section class="panel" style="margin-top:18px"><div class="content"><div class="tag">'+(fede?'Riservato':'Prenotazioni')+'</div><h2>ACCEDI</h2><p class="notes">'+(fede?'Usa l’email autorizzata dall’amministratore.':'Se hai già un account, accedi senza registrarti di nuovo.')+'</p><button class="btn red" id="fg-login">ACCEDI</button></div></section>';document.getElementById('fg-login').onclick=()=>fgLogin()?.click()}
function fgListenEvents(draw){stopEvents=onSnapshot(collection(fgDb,'events'),s=>{fgEvents=s.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>String(a.date).localeCompare(String(b.date)));draw()})}
async function fgRequest(id){const ev=fgEvents.find(x=>x.id===id);if(!ev)return;const profile=(await getDoc(doc(fgDb,'profiles',fgUser.uid))).data()||{};await setDoc(doc(fgDb,'bookingRequests',fgUser.uid+'_'+id),{userId:fgUser.uid,userEmail:fgUser.email,customerName:[profile.name,profile.surname].filter(Boolean).join(' ')||fgUser.email,eventId:id,date:ev.date||'',track:ev.track||'',status:'pending',createdAt:serverTimestamp()});alert('Richiesta inviata a Fede: riceverai conferma dopo la sua approvazione.')}
function fgClient(){fgReset();const draw=()=>{const mine=new Map(fgRequests.map(x=>[x.eventId,x]));const cards=fgEvents.filter(e=>e.fedePresent).map(e=>{const r=mine.get(e.id);return '<article class="portal-card"><div class="tag">Uscita disponibile</div><h3>'+fgEsc(e.track||'Pista da definire')+'</h3><p><b>'+fgEsc(e.date||'Data da definire')+'</b><br>Posti: '+Math.max(0,Number(e.capacity||0)-Number(e.booked||0))+' disponibili</p>'+(r?'<div class="portal-status">'+(r.status==='confirmed'?'CONFERMATA':r.status==='rejected'?'NON ACCETTATA':'IN ATTESA DI FEDE')+'</div>':'<div class="portal-actions"><button class="btn red" data-book="'+e.id+'">INVIA RICHIESTA</button></div>')+'</article>'}).join('')||'<div class="portal-empty">Al momento non ci sono uscite disponibili. Torna a controllare presto.</div>';fgRoot.innerHTML=fgHero('FG PRO SUSPENSION','AREA<br><b>CLIENTI</b>','Scegli un’uscita disponibile e invia la richiesta. Fede dovrà confermarla.')+'<section class="portal-grid">'+cards+'</section><p class="portal-actions"><button class="btn" id="fg-out">ESCI</button></p>';fgRoot.querySelectorAll('[data-book]').forEach(b=>b.onclick=()=>fgRequest(b.dataset.book));document.getElementById('fg-out').onclick=()=>signOut(fgAuth)};fgListenEvents(draw);stopRequests=onSnapshot(query(collection(fgDb,'bookingRequests'),where('userId','==',fgUser.uid)),s=>{fgRequests=s.docs.map(x=>({id:x.id,...x.data()}));draw()})}
async function fgPresence(id,value){await updateDoc(doc(fgDb,'events',id),{fedePresent:value})}
async function fgDecision(id,answer){await runTransaction(fgDb,async tx=>{const rd=doc(fgDb,'bookingRequests',id),r=(await tx.get(rd)).data();if(!r||r.status!=='pending')return;if(answer==='confirmed'){const ed=doc(fgDb,'events',r.eventId),e=(await tx.get(ed)).data();if(!e||!e.fedePresent||Number(e.booked||0)>=Number(e.capacity||0))throw new Error('Posti esauriti o presenza non attiva');tx.update(ed,{booked:Number(e.booked||0)+1})}tx.update(rd,{status:answer,reviewedAt:serverTimestamp()})})}

<script type="module">

function fgClientHome(){const y=new Date().getFullYear();fgApp.innerHTML='<section class="hero"><div><div class="eyebrow">FG Pro Suspension</div><h1>AREA<br><b>CLIENTI</b></h1></div><div>Prenota la tua uscita in pochi passaggi.</div></section><section class="panel" style="margin-top:18px"><div class="content"><div class="tag">Uscite e prenotazioni</div><h2>PRONTO A GIRARE?</h2><p class="notes">Scegli una data resa disponibile da Fede, poi la pista e invia la richiesta.</p><p><button class="btn red" id="fg-book-start">PRENOTA USCITA</button></p></div></section>';document.getElementById('fg-book-start').onclick=()=>fgClientDates(y)}

function mountPasswordChange(){document.body.dataset.fgAdmin='1';root=document.getElementById('fg-admin-v2')||document.createElement('div');root.id='fg-admin-v2';if(!root.isConnected)document.body.append(root);root.innerHTML='<header class="fg-admin-bar"><img src="images.png" alt="FG Pro Suspension"><nav class="fg-admin-nav"><button id="fg-admin-out">Esci</button></nav></header><main class="fg-admin-main"><h1>CAMBIA PASSWORD</h1><section class="fg-admin-panel"><h2>Primo accesso di Fede</h2><p class="fg-admin-sub">'+(passwordChanged?'Password aggiornata. Avvisa Giorgio: dovrà attivare il tuo accesso admin.':'Prima di usare l’area admin, imposta una nuova password. L’accesso sarà attivato da Giorgio dopo il cambio.')+'</p>'+(passwordChanged?'':'<div class="fg-admin-row"><input id="ad-new-password" type="password" autocomplete="new-password" placeholder="Nuova password"><input id="ad-repeat-password" type="password" autocomplete="new-password" placeholder="Ripeti nuova password"></div><p class="fg-admin-sub">Minimo 6 caratteri, una maiuscola, un numero e un carattere speciale.</p><button class="fg-admin-action red" id="ad-change-password">Cambia password</button>')+'<div class="fg-admin-notice" id="fg-admin-notice" role="status"></div></section></main>';root.querySelector('#fg-admin-out').onclick=()=>signOut(auth);const save=root.querySelector('#ad-change-password');if(save)save.onclick=async()=>{const p=root.querySelector('#ad-new-password').value,q=root.querySelector('#ad-repeat-password').value;if(p!==q)return message('Le password non coincidono.');if(!/^(?=.{6,})(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9])/.test(p))return message('Usa almeno 6 caratteri, una maiuscola, un numero e un carattere speciale.');save.disabled=true;try{await updatePassword(auth.currentUser,p);passwordChanged=true;mountPasswordChange()}catch(e){save.disabled=false;message('Cambio password non riuscito: '+(e.code||'errore Firebase'))}}}
function dayBookings(d){return ((role==='owner'||role==='admin')?allBookings():requests).filter(r=>r.date===d&&r.status!=='rejected'&&r.status!=='cancelled')}
function dayModal(){if(!selectedDay)return '';const assigned=dateTracks[selectedDay],chosen=Array.isArray(assigned)?assigned:availability[selectedDay]?tracks.map(t=>t.id):[],options=tracks.map(t=>'<label class="fg-admin-track-choice"><input type="checkbox" data-ad-track value="'+esc(t.id)+'" '+(chosen.includes(t.id)?'checked':'')+'><span>'+esc(t.name)+'</span></label>').join(''),booked=dayBookings(selectedDay),cards=booked.map(r=>{const p=profiles[r.userId]||{},name=[p.name,p.surname].filter(Boolean).join(' ')||r.customerName||r.customerEmail||r.userEmail||'Pilota non indicato',email=r.customerEmail||r.userEmail||r.email||p.email||'',status=r.status==='confirmed'?'Confermata':'In attesa di Fede',extra=(role==='owner'||role==='admin')?[p.ranking&&'Ranking: '+p.ranking,p.bike&&'Moto: '+p.bike,p.city&&'Città: '+p.city].filter(Boolean).map(esc).join(' · '):'';return '<article class="fg-admin-item"><div><small>'+esc(r.track||'Pista non indicata')+'</small><h3>'+esc(name)+'</h3><small>'+esc(email)+'</small>'+(extra?'<p>'+extra+'</p>':'')+'</div><span class="fg-admin-badge '+esc(r.status||'pending')+'">'+status+'</span></article>'}).join('');return '<div class="fg-admin-modal-backdrop" id="ad-day-modal-backdrop"><section class="fg-admin-modal" id="ad-day-modal" role="dialog" aria-modal="true" aria-labelledby="ad-modal-title" tabindex="-1"><div class="fg-admin-modal-head"><h2 id="ad-modal-title">'+esc(dateLabel(selectedDay))+'</h2><button class="fg-admin-action" id="ad-close-day" aria-label="Chiudi">×</button></div><p class="fg-admin-sub">Seleziona le piste disponibili in questa data. Senza piste selezionate, il giorno non sarà prenotabile.</p><div class="fg-admin-track-choices">'+(options||'<p>Prima aggiungi una pista in “Piste e listino”.</p>')+'</div><button class="fg-admin-action red" id="ad-save-day">Salva piste</button>'+(booked.length?'<div class="fg-admin-modal-bookings"><h2>Clienti prenotati · '+booked.length+'</h2><div class="fg-admin-list">'+cards+'</div><p class="fg-admin-sub">Le richieste già inviate restano nello storico anche se cambi le piste disponibili.</p></div>':'')+'</section></div>'}
function calendar(forFede=false){let today=key(new Date().getFullYear(),new Date().getMonth(),new Date().getDate()),byDate=new Map();for(const r of ((role==='owner'||role==='admin')?allBookings():requests)){if(r.status==='rejected'||r.status==='cancelled'||!r.date)continue;const group=byDate.get(r.date)||[];group.push(r);byDate.set(r.date,group)}let cards=months.map((name,m)=>{let offset=(new Date(year,m,1).getDay()+6)%7,count=new Date(year,m+1,0).getDate(),cells=week.map(w=>'<div class="fg-admin-weekday">'+w+'</div>').join('')+Array.from({length:offset},()=>'<div class="fg-admin-empty"></div>').join('');for(let d=1;d<=count;d++){let k=key(year,m,d),on=!!availability[k],entries=byDate.get(k)||[],confirmed=entries.some(r=>r.status==='confirmed'),state=confirmed?'booked':entries.length?'pending':on?'on':'';cells+='<button class="fg-admin-day '+state+'" data-ad-day="'+k+'" '+(k<today&&!entries.length?'disabled':'')+' title="'+k+(entries.length?' · '+entries.length+' '+(confirmed?'prenotazioni confermate':'richieste in attesa'):on?' disponibile':' non disponibile')+'">'+d+(entries.length?'<small>'+entries.length+'</small>':'')+'</button>'}return '<section class="fg-admin-month"><h3>'+name+'</h3><div class="fg-admin-days">'+cells+'</div></section>'}).join('');return (forFede?'<h2>Calendario presenze</h2>':'<h1>CALENDARIO</h1>')+'<p class="fg-admin-sub">Tocca un giorno occupato per vedere il cliente e la pista. Nei giorni liberi puoi cambiare la disponibilità.</p><div class="fg-admin-legend"><span><i class="available"></i>Disponibile</span><span><i class="pending"></i>Richiesta in attesa</span><span><i class="booked"></i>Prenotazione confermata</span></div><div class="fg-admin-year"><button class="fg-admin-action" id="ad-prev">‹</button><strong>'+year+'</strong><button class="fg-admin-action" id="ad-next">›</button></div>'+'<div class="fg-admin-months">'+cards+'</div>'+dayModal()}
function allBookings(){const used=new Set(requests.map(r=>[r.userId,r.date,r.track].join('|')));return requests.map(r=>({...r,source:'request'})).concat(legacy.filter(b=>!used.has([b.userId,b.date,b.track].join('|'))).map(b=>({...b,status:'confirmed',source:'legacy'}))).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')))}
function bookings(){let rows=allBookings().filter(r=>filter==='all'||(filter==='pending'?r.status==='pending':r.status==='confirmed'));let html=rows.map(r=>{let p=profiles[r.userId]||{},name=[p.name,p.surname].filter(Boolean).join(' ')||r.customerName||r.customerEmail||r.userEmail||r.email||'Pilota non indicato',mail=r.customerEmail||r.userEmail||r.email||p.email||'',status=r.status==='confirmed'?'Confermata':r.status==='rejected'?'Rifiutata':'In attesa di Fede';return '<article class="fg-admin-item"><div><small>'+esc(dateLabel(r.date))+' · '+esc(r.track||'Pista non indicata')+'</small><h3>'+esc(name)+'</h3><small>'+esc(mail)+(p.bike?' · '+esc(p.bike):'')+'</small></div><span class="fg-admin-badge '+esc(r.status||'pending')+'">'+status+'</span></article>'}).join('');return '<h1>PRENOTAZIONI</h1><p class="fg-admin-sub">Qui vedi chi ha richiesto o prenotato un’uscita, in quale data e in quale pista. Le richieste diventano confermate solo dopo l’approvazione di Fede.</p><div class="fg-admin-row"><select id="ad-booking-filter"><option value="all">Tutte</option><option value="pending">In attesa</option><option value="confirmed">Confermate</option></select><strong>'+rows.length+' risultati</strong></div><div class="fg-admin-list">'+(html||'<div class="fg-admin-panel">Nessuna prenotazione per questo filtro.</div>')+'</div>'}
function catalog(){let t=tracks.map(x=>'<div class="fg-admin-item"><b>'+esc(x.name)+'</b><span class="fg-admin-item-actions"><button data-edit-track="'+x.id+'">Modifica</button><button data-del-track="'+x.id+'">Elimina</button></span></div>').join(''),s=services.map(x=>'<div class="fg-admin-item"><div><b>'+esc(x.name)+'</b><br><small>'+esc(x.description||'')+'</small></div><span>€ '+Number(x.price||0).toFixed(2)+' <span class="fg-admin-item-actions"><button data-edit-service="'+x.id+'">Modifica</button><button data-del-service="'+x.id+'">Elimina</button></span></span></div>').join('');return '<h1>PISTE E LISTINO</h1><p class="fg-admin-sub">Gestisci le piste selezionabili dai clienti e i prezzi delle lavorazioni.</p><section class="fg-admin-panel"><h2>Piste</h2><div class="fg-admin-row"><input id="ad-track-name" placeholder="Nome pista"><button class="fg-admin-action red" id="ad-add-track">Aggiungi pista</button></div><div class="fg-admin-list">'+(t||'Nessuna pista inserita.')+'</div></section><section class="fg-admin-panel"><h2>Lavorazioni</h2><div class="fg-admin-row"><input id="ad-service-name" placeholder="Lavorazione"><input id="ad-service-price" type="number" min="0" step="0.01" placeholder="Prezzo €"><input id="ad-service-desc" placeholder="Descrizione"><button class="fg-admin-action red" id="ad-add-service">Aggiungi</button></div><div class="fg-admin-list">'+(s||'Nessuna lavorazione inserita.')+'</div></section>'}
function unifiedCalendar(){let pending=requests.filter(r=>r.status==='pending').sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));let cards=pending.map(r=>{let p=profiles[r.userId]||{},name=[p.name,p.surname].filter(Boolean).join(' ')||r.customerName||r.customerEmail||r.userEmail||'Pilota non indicato';return '<article class="fg-admin-item"><div><small>'+esc(dateLabel(r.date))+' · '+esc(r.track||'Pista non indicata')+'</small><h3>'+esc(name)+'</h3><small>'+esc(r.customerEmail||r.userEmail||p.email||'')+'</small></div><div class="fg-admin-item-actions"><button class="fg-admin-action red" data-fede-decision="confirmed" data-request="'+esc(r.id)+'">Conferma</button><button class="fg-admin-action" data-fede-decision="rejected" data-request="'+esc(r.id)+'">Rifiuta</button></div></article>'}).join('');let setting=role==='owner'?'<section class="fg-admin-panel"><h2>Account admin Fede</h2><p class="fg-admin-sub">L’account '+esc(fedeAdminEmail)+' avrà gli stessi menu di gestione, ma solo dopo il cambio della password e la tua attivazione.</p><p>Stato: <b>'+(settings.fedeAdminActive?'Attivo':'In attesa di attivazione')+'</b></p>'+(settings.fedeAdminActive?'<button class="fg-admin-action" id="ad-deactivate-fede">Disattiva accesso admin</button>':'<label class="fg-admin-track-choice"><input id="ad-password-verified" type="checkbox">Fede mi ha confermato di aver cambiato la password</label><button class="fg-admin-action red" id="ad-activate-fede" disabled>Attiva account admin</button>')+'</section>':'';return '<h1>CALENDARIO</h1><p class="fg-admin-sub">Gestisci date e piste, visualizza i clienti prenotati e conferma o rifiuta le richieste.</p><section class="fg-admin-panel"><h2>Richieste da confermare · '+pending.length+'</h2><div class="fg-admin-list">'+(cards||'<p>Nessuna richiesta in attesa.</p>')+'</div></section>'+setting+'<section class="fg-admin-panel">'+calendar(true)+'</section>'}
function render(){if(!root)return;root.querySelectorAll('[data-ad-tab]').forEach(b=>b.classList.toggle('active',b.dataset.adTab===tab));let view=root.querySelector('#fg-admin-content');view.innerHTML=(tab==='calendar'?unifiedCalendar():tab==='bookings'?bookings():catalog())+'<div class="fg-admin-notice" id="fg-admin-notice" role="status">'+esc(notice||'')+'</div>';if(tab==='calendar'){bindCalendar();bindFede()}if(tab==='bookings'){let f=view.querySelector('#ad-booking-filter');f.value=filter;f.onchange=()=>{filter=f.value;render()}}if(tab==='catalog')bindCatalog();}
function bindCalendar(){root.querySelector('#ad-prev').onclick=()=>{year--;selectedDay='';render()};root.querySelector('#ad-next').onclick=()=>{year++;selectedDay='';render()};root.querySelectorAll('[data-ad-day]').forEach(b=>b.onclick=()=>{selectedDay=b.dataset.adDay;render();root.querySelector('#ad-day-modal')?.focus()});const close=()=>{selectedDay='';render()};const closeButton=root.querySelector('#ad-close-day');if(closeButton)closeButton.onclick=close;const backdrop=root.querySelector('#ad-day-modal-backdrop');if(backdrop)backdrop.onclick=e=>{if(e.target===backdrop)close()};const save=root.querySelector('#ad-save-day');if(save)save.onclick=async()=>{const day=selectedDay,ids=[...root.querySelectorAll('[data-ad-track]:checked')].map(x=>x.value);save.disabled=true;try{await setDoc(doc(db,'availability',day),{date:day,available:ids.length>0,trackIds:ids,updatedAt:serverTimestamp()},{merge:true});selectedDay='';render();message(ids.length?'Piste salvate per '+day+'.':day+' reso non disponibile.')}catch(e){save.disabled=false;message('Impossibile salvare le piste: '+(e.code||'errore Firebase'))}}}
async function run(action,success){try{await action();message(success)}catch(e){message('Salvataggio non riuscito: '+(e.code||'errore Firebase'))}}
function bindCatalog(){root.querySelector('#ad-add-track').onclick=()=>{let name=root.querySelector('#ad-track-name').value.trim();if(!name)return message('Inserisci il nome della pista.');if(tracks.some(x=>x.name?.toLowerCase()===name.toLowerCase()))return message('Questa pista è già presente.');run(()=>addDoc(collection(db,'tracks'),{name,createdAt:serverTimestamp()}),'Pista aggiunta.')};root.querySelector('#ad-add-service').onclick=()=>{let name=root.querySelector('#ad-service-name').value.trim(),raw=root.querySelector('#ad-service-price').value,price=Number(raw),description=root.querySelector('#ad-service-desc').value.trim();if(!name||raw===''||!Number.isFinite(price)||price<0)return message('Inserisci lavorazione e prezzo valido.');run(()=>addDoc(collection(db,'services'),{name,price,description,createdAt:serverTimestamp()}),'Lavorazione aggiunta.')};root.querySelectorAll('[data-edit-track]').forEach(b=>b.onclick=()=>{let x=tracks.find(t=>t.id===b.dataset.editTrack),name=prompt('Nome pista',x.name);if(name?.trim())run(()=>updateDoc(doc(db,'tracks',x.id),{name:name.trim()}),'Pista aggiornata.')});root.querySelectorAll('[data-del-track]').forEach(b=>b.onclick=()=>{let x=tracks.find(t=>t.id===b.dataset.delTrack);if(confirm('Eliminare la pista '+x.name+'?'))run(()=>deleteDoc(doc(db,'tracks',x.id)),'Pista eliminata.')});root.querySelectorAll('[data-edit-service]').forEach(b=>b.onclick=()=>{let x=services.find(t=>t.id===b.dataset.editService),name=prompt('Lavorazione',x.name);if(!name?.trim())return;let raw=prompt('Prezzo €',x.price);if(raw===null||raw.trim()===''||!Number.isFinite(Number(raw))||Number(raw)<0)return;let description=prompt('Descrizione',x.description||'');if(description===null)return;run(()=>updateDoc(doc(db,'services',x.id),{name:name.trim(),price:Number(raw),description}),'Lavorazione aggiornata.')});root.querySelectorAll('[data-del-service]').forEach(b=>b.onclick=()=>{let x=services.find(t=>t.id===b.dataset.delService);if(confirm('Eliminare la lavorazione '+x.name+'?'))run(()=>deleteDoc(doc(db,'services',x.id)),'Lavorazione eliminata.')})}
function bindFede(){root.querySelectorAll('[data-fede-decision]').forEach(b=>b.onclick=async()=>{const id=b.dataset.request,status=b.dataset.fedeDecision;b.disabled=true;await run(()=>updateDoc(doc(db,'bookingRequests',id),{status,reviewedAt:serverTimestamp()}),status==='confirmed'?'Richiesta confermata.':'Richiesta rifiutata.');b.disabled=false});const check=root.querySelector('#ad-password-verified'),activate=root.querySelector('#ad-activate-fede');if(check&&activate){check.onchange=()=>{activate.disabled=!check.checked};activate.onclick=()=>run(()=>setDoc(doc(db,'settings','booking'),{fedeAdminActive:true},{merge:true}),'Accesso admin di Fede attivato.')};const deactivate=root.querySelector('#ad-deactivate-fede');if(deactivate)deactivate.onclick=()=>{if(confirm('Disattivare l’accesso admin di Fede?'))run(()=>setDoc(doc(db,'settings','booking'),{fedeAdminActive:false},{merge:true}),'Accesso admin di Fede disattivato.')}}

onAuthStateChanged(auth,u=>{stops.forEach(f=>f());stops=[];root?.remove();root=null;role=null;delete document.body.dataset.fgAdmin;if(!u)return;const email=String(u.email||'').toLowerCase();let feedsStarted=false;watch(doc(db,'settings','booking'),s=>{settings=s.data()||{};const next=email===owner?'owner':u.uid===fedeAdminUid?(settings.fedeAdminActive?'admin':'pending_admin'):email===String(settings.fedeEmail||'').toLowerCase()?'fede':null;if(!next){root?.remove();root=null;role=null;delete document.body.dataset.fgAdmin;return}if(role==='admin'&&next==='pending_admin'){signOut(auth);return}if(role!==next||!root){role=next;tab='calendar';mount()}else if(tab==='calendar'&&role!=='pending_admin')render();if(next==='pending_admin'||feedsStarted)return;feedsStarted=true;watch(collection(db,'availability'),s=>{availability={};dateTracks={};s.forEach(d=>{availability[d.id]=!!d.data().available;dateTracks[d.id]=Array.isArray(d.data().trackIds)?d.data().trackIds:null});if(tab==='calendar')render()});watch(collection(db,'bookingRequests'),s=>{requests=s.docs.map(d=>({id:d.id,...d.data()}));if(tab==='calendar'||tab==='bookings')render()});watch(collection(db,'tracks'),s=>{tracks=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.name).localeCompare(String(b.name)));if(tab==='calendar'||tab==='catalog')render()});if(role==='owner'||role==='admin'){watch(collection(db,'bookings'),s=>{legacy=s.docs.map(d=>({id:d.id,...d.data()}));if(tab==='calendar'||tab==='bookings')render()});watch(collection(db,'profiles'),s=>{profiles={};s.forEach(d=>{profiles[d.id]=d.data()});if(tab==='calendar'||tab==='bookings')render()});watch(collection(db,'services'),s=>{services=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.name).localeCompare(String(b.name)));if(tab==='catalog')render()})}})})
}
</script>
