<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FG Pro Suspension</title><style>:root{--r:#d91e2f;--b:#080808;--p:#141517;--l:#35383c;--t:#e9ebed;--m:#9ba0a6}*{box-sizing:border-box}body{margin:0;background:#090909;color:var(--t);font:Arial,sans-serif}.top{background:#050505;border-bottom:2px solid var(--r);padding:10px 18px;position:sticky;top:0;z-index:5}.nav{max-width:1240px;margin:auto;display:flex;justify-content:space-between;align-items:center}.logo{height:45px}.btn,select,input{background:#17191c;color:#fff;border:1px solid var(--l);padding:10px 12px;font:inherit}.btn{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;cursor:pointer;transform:skew(-8deg)}.btn.red{background:var(--r);border-color:var(--r)}.app{max-width:1240px;margin:auto;padding:24px 18px}.hero{display:flex;justify-content:space-between;gap:18px;align-items:end;border-bottom:1px solid var(--l);padding:26px 0}.eyebrow,.tag{color:#ff4050;font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.hero h1{margin:8px 0 0;font-size:clamp(34px,6vw,66px);line-height:.85;font-style:italic}.hero h1 b{color:var(--r)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.filters input{min-width:250px}.layout{display:grid;grid-template-columns:290px 1fr;gap:18px}.list{display:grid;gap:8px;align-content:start}.record{background:var(--p);border:1px solid var(--l);padding:14px;cursor:pointer}.record:hover,.record.active{border-left:4px solid var(--r)}.record h3{margin:4px 0;color:#fff;font-size:16px;font-style:italic}.record small{color:var(--m)}.panel{background:linear-gradient(145deg,#17191c,#0e0f10);border:1px solid var(--l)}.panel-head{padding:20px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.panel-head h2{margin:4px 0;font-size:28px;font-style:italic}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{background:#111214;color:#cbd0d5;border:1px solid var(--l);padding:9px 12px;font-weight:bold;cursor:pointer}.tabs button.active{background:var(--r);color:#fff;border-color:var(--r)}.content{padding:18px}.stacks{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stack{border:1px solid var(--l);background:#101113;padding:14px}.stack h3{margin:0 0 9px;color:#fff;font-size:14px;text-transform:uppercase;font-style:italic}.stack pre{margin:0;white-space:pre-wrap;color:#d9dde1;font:13px/1.55 monospace}.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.spec{border-left:3px solid var(--r);background:#111214;padding:10px}.spec small{display:block;color:var(--m);text-transform:uppercase;font-size:10px}.spec b{display:block;margin-top:4px}.notes{margin-top:14px;border:1px solid var(--l);padding:14px;color:#c5c9ce}.empty{color:var(--m);padding:20px}@media(max-width:820px){.layout{grid-template-columns:1fr}.stacks{grid-template-columns:1fr}.specs{grid-template-columns:1fr 1fr}.hero{align-items:start;flex-direction:column}}@media(max-width:480px){.specs{grid-template-columns:1fr}.filters input{min-width:100%}}</style></head><body><header class="top"><nav class="nav"><img class="logo" src="images.png" alt="FG Pro Suspension"><button class="btn red" id="new">Nuovo setup</button></nav></header><main class="app"><section class="hero"><div><div class="eyebrow">Technical setup archive</div><h1>FG PRO<br><b>SUSPENSION</b></h1></div><div>Forcella, mono, pile lamelle, click, pressioni e revisioni.</div></section><div class="filters"><input id="q" placeholder="Cerca rider, moto o anno"><select id="year"><option value="">Tutti gli anni</option></select></div><section class="layout"><aside class="list" id="list"></aside><article class="panel" id="detail"></article></section></main><script>const records=[{id:1,rider:'Biffi',model:'KTM 250 SX-F',year:2021,notes:'Base PDF: forcella STD 21. Setup testato con cartuccia WP.',fork:{STD:{reb:'26-0.10x2\n28-0.10x2\n26-0.10\n24-0.10\n22-0.10\n20-0.10\n18-0.10\n16-0.10\n9-0.30\nstopper 25-4.00',mid:'9-0.15\n9-0.20x5\n30-0.15x8\n28-0.15x3\n26-0.15x2\n24-0.10x3\n22-0.10x2\n20-0.10x3',comp:'30-0.15x10\n28-0.15x2\n26-0.15\n24-0.15\n22-0.15\n20-0.15\n18-0.15\n16-0.15\n14-0.15',low:'12-0.25\n25-4.00',spec:[['Molla','3.85'],['Olio esterno','220 ml'],['Olio cartuccia','370 ml'],['Olio aria','210 ml'],['Comp.','20 click'],['Ritorno','20 click']]},MOD1:{reb:'28-0.10x3\n26-0.10\n24-0.10\n22-0.10\n20-0.10\n18-0.10\n16-0.10',mid:'30-0.15x6\n28-0.15\n26-0.15\n24-0.10x3',comp:'30-0.15x5\n28-0.15\n26-0.15\n24-0.15',low:'12-0.25\nstopper 25-4.00',spec:[['Molla','16 N/m'],['Olio esterno','275 ml'],['Cartuccia','WP'],['Pressione','9 bar'],['Comp.','20'],['Ritorno','20']]}},shock:{STD:{reb:'40-0.20x3\n28-0.10\n24-0.10\n36-0.30\n34-0.30\n32-0.30\n30-0.30\n28-0.30\n26-0.30\n23-0.30',mid:'44-0.20x10\n44-0.25x4\n42-0.25\n40-0.25\n38-0.25\n36-0.25',comp:'22-0.20x6\n18-0.20\n14-0.20\n10-0.20\n8-0.30',low:'30-0.30x4',spec:[['Molla','WP 4.2'],['Separatore','95 mm'],['Pressione','10 bar'],['Comp.','14'],['High speed','1 giro'],['Ritorno','11']]}}},{id:2,rider:'Ungaro',model:'KTM 250F',year:2018,notes:'Configurazione WP con livello cartuccia 130 mm.',fork:{STD:{reb:'26-0.10x2\n28-0.10x2\n26-0.10\n24-0.10\n22-0.10\n20-0.10\n18-0.10\n16-0.10',mid:'30-0.10x4\n28-0.15\n26-0.15\n24-0.15\n22-0.15',comp:'30-0.15x5\n28-0.15x2\n26-0.15\n24-0.15',low:'14-0.10\n12-0.10',spec:[['Livello cart.','130 mm'],['Press. aria','9.8 bar'],['Comp.','17'],['Ritorno','12'],['Molla','STD'],['Note','WP']] }},shock:{STD:{reb:'40-0.20x3\n28-0.10\n24-0.10\n36-0.30\n34-0.30',mid:'44-0.25x5\n44-0.20x9\n42-0.25\n40-0.25',comp:'22-0.20x6\n18-0.20\n14-0.20',low:'30-0.30x2',spec:[['Molla','42-260'],['Separatore','95.8 mm'],['Pressione','10 bar'],['Comp.','14'],['High speed','1¼ giri'],['Ritorno','12']]}}}];let state={id:1,part:'fork',variant:'STD'};const el=x=>document.getElementById(x);function variants(r){return Object.keys(r[state.part])}function draw(){let q=el('q').value.toLowerCase(),y=el('year').value;let a=records.filter(r=>(!y||r.year==y)&&JSON.stringify(r).toLowerCase().includes(q));el('list').innerHTML=a.length?a.map(r=>'<div class="record '+(r.id==state.id?'active':'')+'" onclick="pick('+r.id+')"><div class="tag">'+r.year+'</div><h3>'+r.model+'</h3><small>Rider: '+r.rider+'</small></div>').join(''):'<div class="empty">Nessun setup.</div>';let r=records.find(x=>x.id==state.id)||a[0];if(!r){el('detail').innerHTML='<div class="empty">Seleziona un setup.</div>';return}state.id=r.id;if(!r[state.part][state.variant])state.variant=variants(r)[0];let s=r[state.part][state.variant];el('detail').innerHTML='<div class="panel-head"><div><div class="tag">'+r.year+' · '+r.rider+'</div><h2>'+r.model+'</h2></div><div class="tabs"><button class="'+(state.part=='fork'?'active':'')+'" onclick="part('fork')">Forcella</button><button class="'+(state.part=='shock'?'active':'')+'" onclick="part('shock')">Mono</button>'+variants(r).map(v=>'<button class="'+(state.variant==v?'active':'')+'" onclick="variant(&quot;'+v+'&quot;)">'+v+'</button>').join('')+'</div></div><div class="content"><div class="stacks">'+[['Rebound',s.reb],['Mid Speed',s.mid],['Compression',s.comp],['Low Speed',s.low]].map(x=>'<section class="stack"><h3>'+x[0]+'</h3><pre>'+x[1]+'</pre></section>').join('')+'</div><div class="specs">'+s.spec.map(x=>'<div class="spec"><small>'+x[0]+'</small><b>'+x[1]+'</b></div>').join('')+'</div><div class="notes"><b>NOTE E REVISIONI</b><br>'+r.notes+'</div></div>'}function pick(i){state.id=i;state.part='fork';state.variant='STD';draw()}function part(p){state.part=p;state.variant='STD';draw()}function variant(v){state.variant=v;draw()}let ys=[...new Set(records.map(r=>r.year))].sort();el('year').innerHTML+='<option>'+ys.join('</option><option>')+'</option>';el('q').oninput=draw;el('year').onchange=draw;el('new').onclick=()=>{let rider=prompt('Nome rider');let year=prompt('Anno moto');let model=prompt('Modello KTM');if(rider&&year&&model){records.push({id:Date.now(),rider,year,model,notes:'Nuovo setup - completa i valori.',fork:{STD:{reb:'Da inserire',mid:'Da inserire',comp:'Da inserire',low:'Da inserire',spec:[['Molla',''],['Olio',''],['Pressione',''],['Comp.',''],['Ritorno',''],['Note','']] }},shock:{STD:{reb:'Da inserire',mid:'Da inserire',comp:'Da inserire',low:'Da inserire',spec:[['Molla',''],['Separatore',''],['Pressione',''],['Comp.',''],['Ritorno',''],['Note','']]}}});state.id=records.at(-1).id;draw()}};draw()</script></body></html>
